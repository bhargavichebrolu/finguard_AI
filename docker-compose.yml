# Local development stack. Values come from .env (run scripts/generate_env.py to create it).
# No credential is written here, and start-up fails if a required one is missing.
name: finguard

services:
  db:
    # Pinned by digest: the exact PostgreSQL 17 image tested (Phase 5 reproducibility).
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # The image trusts loopback connections unless told otherwise. Applied at first
      # initialisation only, so it is set here from the very first start of the volume.
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      TEST_DB_NAME: ${TEST_DB_NAME:?set TEST_DB_NAME in .env}
    volumes:
      - finguard_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to this computer only, never to the wider network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    image: finguard-api:local
    command: ["alembic", "upgrade", "head"]
    environment: &api-environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MODEL_METADATA_PATH: /app/artifacts/metadata/model_v1.json
      MODEL_METRICS_PATH: /app/artifacts/metadata/model_v1_metrics.json
      PREPROCESSING_METADATA_PATH: /app/artifacts/metadata/preprocessing_v1.json
      MODEL_ARTIFACT_DIR: /app/artifacts/models
      MODEL_REPORT_PATH: /app/artifacts/metadata/model_v1_report.json
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      UPLOAD_TMP_DIR: /tmp/finguard-uploads
      # Uvicorn reads this as its worker count (Phase 5 M3). Each worker loads the model.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: finguard-api:local
    restart: unless-stopped
    environment: *api-environment
    volumes:
      # The frozen model and metadata are read-only inside the container.
      - ./artifacts:/app/artifacts:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Browser-test stack (profile "e2e"): the same image against the test database only, on its
  # own port. Started by scripts/e2e_stack.py, which supplies a fresh E2E_SECRET_KEY each time;
  # without one the API refuses to start. Never part of a plain "docker compose up".
  migrate-e2e:
    image: finguard-api:local
    profiles: ["e2e"]
    command: ["alembic", "upgrade", "head"]
    environment: &e2e-environment
      <<: *api-environment
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${E2E_DB_NAME:-finguard_e2e_test}
      SECRET_KEY: ${E2E_SECRET_KEY:-}
      # Only the preview server the browser tests use. The browser reaches the API through it.
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
      TRUSTED_PROXY_IPS: ""
      # For measurements only: compare stores and worker counts on the browser-test stack.
      RATE_LIMIT_STORE: ${E2E_RATE_LIMIT_STORE:-database}
      WEB_CONCURRENCY: ${E2E_WEB_CONCURRENCY:-1}
      # The setup project signs in once and every test reuses those sessions. With the default
      # 30 minutes, a run slower than that (a loaded machine) failed with Sign in pages (Phase 5
      # Firefox investigation). Expiry itself is tested by revoking sessions, not by waiting.
      ACCESS_TOKEN_MINUTES: ${E2E_ACCESS_TOKEN_MINUTES:-120}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api-e2e:
    image: finguard-api:local
    profiles: ["e2e"]
    restart: "no"
    environment: *e2e-environment
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "127.0.0.1:${E2E_API_HOST_PORT:-8011}:8000"
    depends_on:
      migrate-e2e:
        condition: service_completed_successfully

  # Production-like stack (profile "prodlike", Phase 5 M5): HTTPS through Caddy, one origin,
  # APP_ENV=production. Started by scripts/prodlike_stack.py with a fresh PRODLIKE_SECRET_KEY.
  # Its own test database; production settings (Secure cookies, database rate limits) apply.
  migrate-prodlike:
    image: finguard-api:local
    profiles: ["prodlike"]
    command: ["alembic", "upgrade", "head"]
    environment: &prodlike-environment
      <<: *api-environment
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${PRODLIKE_DB_NAME:-finguard_prodlike_test}
      SECRET_KEY: ${PRODLIKE_SECRET_KEY:-}
      CORS_ALLOWED_ORIGINS: https://127.0.0.1:8443
      # Only Caddy's fixed address. Anything else's X-Forwarded-For is ignored.
      TRUSTED_PROXY_IPS: 172.30.250.10
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api-prodlike:
    image: finguard-api:local
    profiles: ["prodlike"]
    restart: "no"
    environment: *prodlike-environment
    volumes:
      - ./artifacts:/app/artifacts:ro
    networks:
      default: {}
      prodlike:
        ipv4_address: 172.30.250.20
    ports:
      # Exposed only so tests can show that requests bypassing the proxy cannot spoof addresses.
      - "127.0.0.1:8012:8000"
    depends_on:
      migrate-prodlike:
        condition: service_completed_successfully

  caddy-prodlike:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    profiles: ["prodlike"]
    restart: "no"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_prodlike_data:/data
    networks:
      prodlike:
        ipv4_address: 172.30.250.10
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8082:8082"
    depends_on:
      - api-prodlike

networks:
  prodlike:
    ipam:
      config:
        - subnet: 172.30.250.0/24

volumes:
  finguard_pgdata:
  caddy_prodlike_data:
