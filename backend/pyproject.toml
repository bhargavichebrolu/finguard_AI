[project]
name = "finguard-backend"
version = "0.1.0"
description = "FinGuard AI: fraud detection data pipeline, ML training and FastAPI service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Everything the API image needs. scikit-learn, xgboost and joblib are here because loading the
# frozen model needs them; uv.lock pins them to the versions recorded in its metadata.
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.18",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[dependency-groups]
# Everything needed to validate data, run EDA and train models. Never installed in the API image.
training = [
    "pyarrow>=17",
    "matplotlib>=3.9",
    "imbalanced-learn>=0.12",
    "lightgbm>=4.5",
    "catboost>=1.2.7",
    "shap>=0.46",
    # Floor stops the resolver backtracking to numba 0.53, which has no Python 3.11 build.
    "numba>=0.61",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "pip-audit>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["training", "dev"]
# XGBoost's Linux wheel requires NVIDIA's NCCL (469 MB), used only for multi-GPU training. The
# frozen model is scored on the CPU and nothing here trains on a GPU, so it is never installed:
# a marker that matches no platform removes it. XGBoost itself stays the exact version the model
# was saved with, and the scores were shown to be identical without it (DEPLOYMENT.md, image size).
override-dependencies = ["nvidia-nccl-cu12; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: needs the full PaySim CSV and pipeline outputs; skipped when they are absent",
    "database: needs PostgreSQL through TEST_DATABASE_URL; skipped when it is not set",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
