[project]
name = "finguard-backend"
version = "0.1.0"
description = "FinGuard AI: fraud detection data pipeline, ML training and (from Phase 3) FastAPI service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Runtime dependencies are limited to what the shared feature code imports.
# FastAPI, SQLAlchemy, Alembic and friends are added in Phase 3 when code first uses them.
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
]

[dependency-groups]
# Everything needed to validate data, run EDA and train models. Never installed in the API image.
training = [
    "pyarrow>=17",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "catboost>=1.2.7",
    "shap>=0.46",
    # Floor stops the resolver backtracking to numba 0.53, which has no Python 3.11 build.
    "numba>=0.61",
    "joblib>=1.4",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["training", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: needs the full PaySim CSV and pipeline outputs; skipped when they are absent",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
